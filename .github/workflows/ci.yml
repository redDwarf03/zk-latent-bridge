name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch onnx ezkl

    - name: Install EZKL CLI
      run: |
        curl -sSL https://raw.githubusercontent.com/zkonduit/ezkl/main/install_ezkl_cli.sh | bash
        echo "$HOME/.ezkl" >> $GITHUB_PATH

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly

    - name: Run ML Export
      run: |
        python ml/export_bridge.py

    - name: Run ZK Proof Generation
      run: |
        python zk/generate_proof.py

    - name: Run Foundry Tests
      working-directory: ./contracts
      run: |
        forge test -vvv
