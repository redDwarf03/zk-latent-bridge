name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r ml/requirements.txt

    - name: Install EZKL CLI
      run: |
        curl -sSL https://github.com/zkonduit/ezkl/releases/latest/download/ezkl-linux-gnu.tar.gz -o ezkl.tar.gz
        tar -xzf ezkl.tar.gz
        mkdir -p $HOME/.ezkl/bin
        mv ezkl $HOME/.ezkl/bin/
        echo "$HOME/.ezkl/bin" >> $GITHUB_PATH

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: stable

    - name: Run ML Export
      run: |
        python ml/export_bridge.py

    - name: Run ZK Proof Generation
      run: |
        python zk/generate_proof.py

    - name: Run Foundry Tests
      working-directory: ./contracts
      run: |
        forge install foundry-rs/forge-std --no-git --no-commit || true
        forge test -vvv
